defaults:
  - base
  - _self_

candidate_preferred_spawn_biome:
  - "plains"

task_conf:
  - name: "mine"
    text: "mine_block:diamond_ore"

reward_conf:
  - event: "mine_block"
    max_reward_times: 1
    reward: 1.0
    objects:
      - "diamond_ore"
      - "deepslate_diamond_ore"
    identity: "mine diamond"

init_inventory:
  - slot: 0
    type: "iron_pickaxe"
    quantity: 1
  - slot: 1
    type: "torch"
    quantity: 64
